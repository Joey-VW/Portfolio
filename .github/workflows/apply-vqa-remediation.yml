name: Apply Visual QA Remediation

on:
  push:
    branches:
      - fix/visual-qa-remediation-pass-1

permissions:
  contents: write

concurrency:
  group: apply-vqa-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and validate remediation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Apply assertion-checked patch
        run: python tools/apply_vqa_remediation_once.py

      - name: Run focused visual QA tests
        run: python -m unittest tests.test_visual_qa_capture -v

      - name: Compile changed Python
        run: python -m compileall -q tools tests

      - name: Check whitespace
        run: git diff --check

      - name: Commit durable changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix visual QA coverage and responsive defects"
          git push origin "HEAD:${{ github.ref_name }}"
