name: Release readiness live verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-production:
    if: github.head_ref == 'ops/release-readiness-live-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed release baseline
        shell: bash
        run: |
          set -euo pipefail

          deployed=false
          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' 'https://wistoworks.com/__release-readiness-not-found__')"
            root="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 'https://wistoworks.com/')"
            if grep -Fq '<link rel="canonical" href="https://wistoworks.com/" />' <<<"$root"; then
              canonical=yes
            else
              canonical=no
            fi
            echo "Deployment marker attempt ${attempt}/24: 404=${status}, root-canonical=${canonical}"
            if [ "$status" = "404" ] && [ "$canonical" = "yes" ]; then
              deployed=true
              break
            fi
            sleep 15
          done

          test "$deployed" = "true"
          echo "PR #66 production baseline is live. Running final checks."

          check_effective() {
            local url="$1" expected="$2" effective
            effective="$(curl --fail --silent --show-error --location --max-redirs 8 --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{url_effective}' "$url")"
            echo "$url -> $effective"
            test "$effective" = "$expected"
          }

          check_effective 'https://wistoworks.com/' 'https://wistoworks.com/'
          check_effective 'http://wistoworks.com/' 'https://wistoworks.com/'
          check_effective 'https://www.wistoworks.com/' 'https://wistoworks.com/'
          check_effective 'http://www.wistoworks.com/' 'https://wistoworks.com/'
          check_effective 'https://wistoworks.com/index.html' 'https://wistoworks.com/'
          check_effective 'https://wistoworks.com/projects/index.html' 'https://wistoworks.com/projects/'

          body="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 'https://wistoworks.com/projects/')"
          grep -Fq '<link rel="canonical" href="https://wistoworks.com/projects/" />' <<<"$body"
          ! grep -Fq 'joewisto.com' <<<"$body"
          echo "Projects hub canonical/domain checks passed."

          body="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 'https://wistoworks.com/projects/procurement-kpi-analysis.html')"
          if grep -Fq '<link rel="canonical" href="https://wistoworks.com/projects/procurement-kpi-analysis.html" />' <<<"$body"; then
            echo "Procurement canonical assertion passed."
          else
            echo "::error::Procurement canonical assertion failed."
            grep -oE '<link rel="canonical"[^>]*>' <<<"$body" || true
            exit 1
          fi
          if grep -Fq 'https://github.com/Joey-VW/Portfolio/tree/main/sql/procurement' <<<"$body"; then
            echo "Procurement durable evidence-link assertion passed."
          else
            echo "::error::Procurement durable evidence-link assertion failed."
            grep -oE 'https://github.com/Joey-VW/Portfolio[^"< ]+' <<<"$body" || true
            exit 1
          fi
          if grep -Fq 'feat/procurement-sql-evidence' <<<"$body"; then
            echo "::error::Stale Procurement feature-branch reference is still live."
            exit 1
          fi
          echo "Procurement stale-branch assertion passed."

          for path in \
            '/projects/phx-transit-pulse.html' \
            '/projects/shrinkflation-tracker.html' \
            '/games/gravity-fleet-lab.html' \
            '/projects/quote-to-cash-workflow-audit.html' \
            '/projects/multi-platform-publishing-system.html' \
            '/projects/ev-true-cost.html'; do
            body="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "https://wistoworks.com${path}")"
            grep -Fq "<link rel=\"canonical\" href=\"https://wistoworks.com${path}\" />" <<<"$body"
            ! grep -Fq 'joewisto.com' <<<"$body"
            echo "$path canonical/domain check passed."
          done

          root_headers="$(curl --silent --show-error --head --connect-timeout 10 --max-time 30 'https://wistoworks.com/' | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          grep -q '^x-content-type-options: nosniff$' <<<"$root_headers"
          grep -q '^referrer-policy: strict-origin-when-cross-origin$' <<<"$root_headers"
          grep -q '^permissions-policy: camera=(), microphone=(), geolocation=()$' <<<"$root_headers"
          echo "Root security headers passed."

          demo_headers="$(curl --silent --show-error --head --connect-timeout 10 --max-time 30 'https://wistoworks.com/projects/multi-platform-publishing-system/demo/' | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          grep -q '^x-robots-tag: noindex, nofollow$' <<<"$demo_headers"
          echo "Postcard Atlas noindex header passed."

          not_found_body="$(curl --silent --show-error --connect-timeout 10 --max-time 30 'https://wistoworks.com/__release-readiness-not-found__')"
          grep -Fq '<meta name="robots" content="noindex, nofollow" />' <<<"$not_found_body"
          grep -Fq 'This route doesn'"'"'t exist.' <<<"$not_found_body"
          echo "404 body/status checks passed."

          echo "Production release verification passed."

      - name: Remove one-shot verification branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "${GITHUB_HEAD_REF}"
