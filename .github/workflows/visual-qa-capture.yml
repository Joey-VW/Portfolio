name: Visual QA Capture

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site origin to capture
        required: true
        default: https://wistoworks.com
        type: string
      include_demo:
        description: Include the Multi-Platform Publishing System demo pages
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture public site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install visual QA dependencies
        run: uv sync --extra capture --locked

      - name: Install Playwright Chromium
        # GitHub's Ubuntu runner already ships Chromium/Chrome and their OS libraries.
        # Download only Playwright's matching browser binary; avoid apt via --with-deps.
        run: uv run playwright install chromium

      - name: Capture site
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --base-url "${{ inputs.base_url }}"
            --output-dir visual-qa-output
          )
          if [ "${{ inputs.include_demo }}" != "true" ]; then
            args+=(--no-demo)
          fi
          uv run python tools/visual_qa_capture.py "${args[@]}"

      - name: Upload visual QA bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-visual-qa-${{ github.run_id }}
          path: visual-qa-output/*.zip
          if-no-files-found: error
          retention-days: 14
