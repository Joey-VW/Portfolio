name: Update Kroger observations

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. America/Phoenix is UTC-7 year-round, so 15:15 UTC is Wednesday 8:15 AM Phoenix time.
    - cron: "15 15 * * 3"

permissions:
  contents: write

concurrency:
  group: kroger-observation-update
  cancel-in-progress: false

jobs:
  update-observations:
    name: Update Kroger observation data
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.KROGER_SCHEDULE_ENABLED == 'true'
    env:
      KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
      KROGER_LOCATION_ID: ${{ secrets.KROGER_LOCATION_ID }}
      KROGER_ZIP_CODE: ${{ secrets.KROGER_ZIP_CODE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run offline merge fixture before credentials
        run: python tools/fetch_kroger_products.py --test-merge-fixture

      - name: Fetch, validate, and apply Kroger observations
        run: python tools/fetch_kroger_products.py --apply-observations --strict-validation

      - name: Commit data update when meaningful
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/shrinkflation-products.json; then
            echo "No meaningful Kroger observation changes to commit."
            exit 0
          fi

          changed_files="$(git diff --name-only)"
          unexpected_files="$(printf '%s\n' "$changed_files" | sed '/^data\/shrinkflation-products\.json$/d' | sed '/^$/d')"
          if [ -n "$unexpected_files" ]; then
            echo "Unexpected tracked files changed; refusing to commit:" >&2
            printf '%s\n' "$unexpected_files" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shrinkflation-products.json
          git commit -m "Update Kroger observations"

          git fetch origin "${GITHUB_REF_NAME}"
          if ! git rebase "origin/${GITHUB_REF_NAME}"; then
            echo "Could not safely rebase onto origin/${GITHUB_REF_NAME}; resolve the upstream change and rerun." >&2
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
