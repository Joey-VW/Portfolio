[project]
name = "joewisto-portfolio-tooling"
version = "0.0.0"
description = "Local validation, data preparation, and capture tooling for the static portfolio."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
bigquery = [
  "pandas-gbq>=0.29,<1",
]
capture = [
  "pillow>=12,<13",
  "playwright>=1.58,<2",
]
transit = [
  "gtfs-realtime-bindings>=1.0,<2",
]

[dependency-groups]
dev = [
  "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
